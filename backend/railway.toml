[build]
builder = "nixpacks"

[deploy]
# Web service (set BRIEFLY_PROCESS_ROLE=web). Add a second Railway service for the worker:
# BRIEFLY_PROCESS_ROLE=worker  startCommand=python -m briefly_api.scripts.ensure_migrations; python -m briefly_api.workers.runner
startCommand = "python -m briefly_api.scripts.ensure_migrations; uvicorn briefly_api.main:app --host 0.0.0.0 --port $PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
