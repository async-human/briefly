[package]
name = "briefly-orb"
version = "0.1.0"
description = "Briefly — your morning briefing, spoken"
authors = ["Briefly"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "briefly_orb_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# single-instance is desktop-only (it guards against duplicate orbs and forwards
# the briefly:// auth deep link from a second launch into the running instance).
[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
