<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Briefly</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <div class="orb-wrap" data-tauri-drag-region>
        <canvas id="orb" width="180" height="180"></canvas>
        <button id="orb-hit" class="orb-hit" title="Tap to talk" aria-label="Tap to talk"></button>
      </div>

      <div class="status-strip">
        <p id="modeChip" class="mode-chip">Idle</p>
        <p id="caption" class="caption"></p>
        <p id="wakeStatus" class="wake-status"></p>
      </div>

      <div class="controls">
        <button id="replay" class="ctl" title="Push to talk" aria-label="Push to talk">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button id="wake" class="ctl" title="Wake word on/off" aria-label="Wake word on/off">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3v6"/><path d="M8 6a4 4 0 0 1 8 0v6a4 4 0 0 1-8 0z"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>
        </button>
        <button id="proactive" class="ctl" title="Proactive voice on/off" aria-label="Proactive voice on/off">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 11v2"/><path d="M7 8v8"/><path d="M11 5v14"/><path d="M15 9v6"/><path d="M19 7v10"/><path d="M23 10v4"/></svg>
        </button>
        <button id="gear" class="ctl" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 13a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V20a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 6.8 18l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 4 13H4a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 6 6.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 11 4.6V4a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9v.1a1.7 1.7 0 0 0 1.6 1H20a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
        <button id="hide" class="ctl" title="Hide" aria-label="Hide">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14"/></svg>
        </button>
      </div>
      <form id="composer" class="composer" autocomplete="off">
        <input id="query" class="composer-input" type="text" placeholder="Ask Briefly…" />
        <button id="send" class="composer-send" type="submit" aria-label="Send">↵</button>
      </form>

      <div id="settings" class="settings hidden">
        <label class="field">
          <span>API base</span>
          <input id="apiBase" type="text" spellcheck="false" placeholder="https://api.sendbriefly.app" />
        </label>
        <label class="field">
          <span>Device token</span>
          <input id="token" type="password" spellcheck="false" placeholder="paste your bcap_ token" />
        </label>
        <div class="settings-actions">
          <button id="save" class="save">Save</button>
        </div>
        <p class="hint">
          Create a Desktop token in Briefly Settings -> Connected devices, then paste it here.
        </p>
      </div>
    </div>

    <script src="voice.js"></script>
    <script src="orb_session_client.js"></script>
    <script src="orb.js"></script>
  </body>
</html>
